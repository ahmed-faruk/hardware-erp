name: nightly
on:
  schedule: [{ cron: '0 0 * * *' }]
  workflow_dispatch:
jobs:
  e2e-full:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: { browser: [chromium, firefox, webkit] }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: supabase start
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run e2e -- --project=${{ matrix.browser }}

  agent-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 1
      E2E_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: supabase start
      - run: npx e2e-web install chromium --with-deps
      # locator-only steps: no model and no API key anywhere
      - run: npm run test:agent
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: agent-report-${{ github.run_id }}
          path: .e2e/report.json
          if-no-files-found: ignore

  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci && npm run build
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: supabase start
      - run: npx playwright install --with-deps chromium && npm run perf
      - run: npx @lhci/cli autorun
      - uses: grafana/setup-k6-action@v1
      - name: local Supabase URL and anon key for k6 (public values only)
        run: supabase status -o env | grep -E '^(API_URL|ANON_KEY)=' | tr -d '"' | sed -e 's/^API_URL=/SUPABASE_URL=/' -e 's/^ANON_KEY=/SUPABASE_ANON_KEY=/' >> "$GITHUB_ENV"
      - run: k6 run tests/perf/ingest.k6.js

  zap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: docker run --rm -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t "${{ vars.STAGING_URL }}" -I

  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: |
          supabase link --project-ref "$REF"
          supabase db dump -f schema.sql
          supabase db dump --data-only -f data.sql
          tar czf backup.tgz schema.sql data.sql
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" -c backup.tgz
        env:
          REF: ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup.tgz.gpg
          retention-days: 30
